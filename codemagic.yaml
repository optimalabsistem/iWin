workflows:
  ios-iwin-workflow:
    name: Build iWin iOS & iPadOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Print macOS & Xcode Info
        script: |
          xcodebuild -version
          sw_vers
      - name: Build iOS Archive (Ad-hoc / Unsigned)
        script: |
          xcodebuild archive \
            -project app/Mythic.xcodeproj \
            -scheme Mythic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mythic.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Package Payload to IPA & TrollStore TIPA
        script: |
          mkdir -p build/Payload
          cp -r build/Mythic.xcarchive/Products/Applications/Mythic.app build/Payload/
          cd build
          zip -r -q iWin.ipa Payload
          cp iWin.ipa iWin.tipa
          cd ..
          ls -lh build/
    artifacts:
      - build/*.ipa
      - build/*.tipa
