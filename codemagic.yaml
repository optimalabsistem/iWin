workflows:
  ios-iwin-workflow:
    name: Build iWin iOS & iPadOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        CM_RECURSIVE_SUBMODULE_INIT: false
    scripts:
      - name: Print macOS & Xcode Info
        script: |
          xcodebuild -version
          sw_vers
      - name: Setup Submodules and Build FEX for iOS
        script: |
          set -e
          if ! command -v ninja &> /dev/null; then
            brew install ninja
          fi

          git submodule update --init FEX
          git -C FEX submodule update --init External/fmt External/range-v3 External/unordered_dense External/xxhash External/SoftFloat-3e External/cephes External/jemalloc_glibc
          
          if [ -f patches/0001-fex-arm64-nonwin32-virtualquery-fix.patch ]; then
            git -C FEX apply ../patches/0001-fex-arm64-nonwin32-virtualquery-fix.patch || true
          fi

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          CC_PATH=$(xcrun -f clang)
          CXX_PATH=$(xcrun -f clang++)

          cmake -B FEX/build-ios -S FEX \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDK_PATH" \
            -DCMAKE_C_COMPILER="$CC_PATH" \
            -DCMAKE_CXX_COMPILER="$CXX_PATH" \
            -DCMAKE_ASM_COMPILER="$CC_PATH" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-DFEX_IOS_HOST=1" \
            -DCMAKE_CXX_FLAGS="-DFEX_IOS_HOST=1" \
            -DFEX_IOS_HOST=ON \
            -DFEX_IOS_HOST_BUILD=ON \
            -DTUNE_CPU=none \
            -DTUNE_ARCH=armv8.2-a \
            -DBUILD_TESTING=False \
            -DENABLE_LTO=False \
            -G Ninja
          
          ninja -C FEX/build-ios FEXCore FEXCore_Base fmt cephes_128bit xxhash softfloat_3e JemallocLibs
      - name: Build iOS Archive (Ad-hoc / Unsigned)
        script: |
          xcodebuild archive \
            -project app/Mythic.xcodeproj \
            -scheme Mythic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mythic.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Package Payload to IPA & TrollStore TIPA
        script: |
          mkdir -p build/Payload
          cp -r build/Mythic.xcarchive/Products/Applications/Mythic.app build/Payload/
          cd build
          zip -r -q iWin.ipa Payload
          cp iWin.ipa iWin.tipa
          cd ..
          ls -lh build/
    artifacts:
      - build/*.ipa
      - build/*.tipa
